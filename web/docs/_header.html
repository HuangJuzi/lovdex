<style>
  :root{
    --bg:#0d1117; --fg:#c9d1d9; --muted:#8b949e; --accent:#58a6ff; --accent2:#7ee787;
    --border:#30363d; --code-bg:#161b22; --code-fg:#e6edf3; --table-head:#1f2937;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--fg); margin:0;
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  }
  /* pandoc title header */
  #title-block-header{
    max-width:880px; margin:0 auto; padding:38px 56px 18px; border-bottom:1px solid var(--border);
  }
  #title-block-header h1.title{color:#fff; font-size:28px; margin:0 0 8px; line-height:1.25}
  #title-block-header p.subtitle,#title-block-header .subtitle{color:var(--muted); font-size:14px; margin:0}
  /* sidebar TOC (pandoc #TOC) */
  #TOC{
    position:fixed; top:0; left:0; width:248px; height:100vh; overflow-y:auto;
    padding:28px 18px; background:#010409; border-right:1px solid var(--border);
    font-size:13.5px;
  }
  #TOC ul{list-style:none; padding:0; margin:0}
  #TOC li{margin:1px 0}
  #TOC a{color:var(--muted); text-decoration:none; display:block; padding:4px 8px; border-radius:6px}
  #TOC a:hover{color:var(--accent); background:rgba(88,166,255,.08)}
  #TOC ul ul{padding-left:16px}
  #TOC ul ul a{font-size:12.5px}
  /* main content shifted right */
  body{margin-left:248px}
  main, #content-wrapper, body > *:not(#TOC):not(#title-block-header){
    max-width:880px; margin-left:auto; margin-right:auto; padding-left:56px; padding-right:56px;
  }
  /* pandoc wraps body content after header in nothing special; target direct sections */
  h1,h2,h3,h4{color:#fff; font-weight:600; line-height:1.3}
  h1{font-size:24px; margin:32px 0 12px}
  h2{font-size:22px; margin:44px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--border); scroll-margin-top:20px}
  h3{font-size:17px; margin:26px 0 10px; color:var(--accent); scroll-margin-top:20px}
  h4{font-size:15px; margin:18px 0 8px; color:var(--accent2); scroll-margin-top:20px}
  p{margin:10px 0}
  a{color:var(--accent)}
  strong{color:#fff}
  /* code */
  code{font-family:"JetBrains Mono","Fira Code",Consolas,monospace; font-size:13px}
  :not(pre)>code{background:var(--code-bg); color:var(--code-fg); padding:2px 6px; border-radius:5px; border:1px solid var(--border)}
  pre{background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:16px 18px; overflow-x:auto; margin:14px 0}
  pre code{color:var(--code-fg); line-height:1.55; background:none; border:none; padding:0}
  /* blockquote */
  blockquote{margin:14px 0; padding:10px 16px; border-left:3px solid var(--accent); background:rgba(88,166,255,.06); border-radius:0 8px 8px 0; color:var(--muted)}
  blockquote p{margin:0}
  /* tables */
  table{border-collapse:collapse; width:100%; margin:16px 0; font-size:13.5px; display:block; overflow-x:auto}
  thead{background:var(--table-head)}
  th,td{border:1px solid var(--border); padding:9px 12px; text-align:left; vertical-align:top}
  th{color:#fff; font-weight:600}
  td code{font-size:12px}
  tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
  ul,ol{padding-left:24px}
  li{margin:5px 0}
  hr{border:none; border-top:1px solid var(--border); margin:32px 0}
  @media (max-width:880px){
    body{margin-left:0}
    #TOC{position:static; width:auto; height:auto; border-right:none; border-bottom:1px solid var(--border)}
    #title-block-header{padding:24px 18px 14px}
    main, body > *:not(#TOC):not(#title-block-header){padding-left:18px; padding-right:18px}
  }
</style>
